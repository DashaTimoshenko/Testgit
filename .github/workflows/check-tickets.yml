name: Check SkyUp ticket price

on:
  #schedule:
    #- cron: "40 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-tickets
  cancel-in-progress: false

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: python -m pip install "requests>=2.31.0"

      - name: Fetch price
        working-directory: ${{ github.workspace }}
        run: python check_tikets.py

      - name: Commit prices.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.csv
          if git diff --cached --quiet; then
            echo "No CSV changes found"
          else
            git commit -m "Update ticket prices"
            git push
          fi
